<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: Ohne das bleiben oben und unten am iPhone graue
     Balken stehen, und die App sieht sofort nach Webseite aus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Radar</title>
<meta name="description" content="Die Frontpage der Fahrrad-Szene: 199 Quellen, gefiltert und sortiert.">

<!-- Vollbild ohne Browser-Leiste, sobald die App auf dem Startbildschirm
     liegt. Das erste Meta ist der iOS-Weg, das zweite der neue Standard. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<!-- „default" statt „black-translucent": Dann färbt iOS den Bereich der
     Statusleiste mit theme-color, und das passt sich unten hell/dunkel an. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand">
    <h1>Radar</h1>
    <p class="subline" id="subline">wird geladen …</p>
  </div>
  <button class="round" id="btn-find" aria-label="Suche">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.2-4.2"/></svg>
  </button>
  <button class="round" id="btn-cal" aria-label="Termine">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span class="badge" id="cal-badge" hidden></span>
  </button>
  <!-- Zahnrad statt Sonne: Das alte Symbol sah aus wie ein Umschalter für
       hell und dunkel und führte zuverlässig in die Irre. -->
  <button class="round" id="btn-set" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="track" id="track" hidden><div class="bar" id="bar"></div></div>
</header>

<!-- Die Reiterzeile klebt unter der Kopfzeile, nicht dahinter. Dafür setzt
     app.js die gemessene Höhe der Kopfzeile in --topbar-h. Der Rahmen drum
     herum trägt den Verlauf rechts, der zeigt, dass es weitergeht. -->
<div class="chipbar" id="chipbar">
  <nav class="chips" id="chips" aria-label="Rubriken"></nav>
</div>

<main id="scroller">
  <div class="pull" id="pull"><span id="pull-label">Zum Aktualisieren ziehen</span></div>
  <div id="content"></div>
  <footer class="colophon" id="colophon"></footer>
</main>

<button class="fab" id="fab" hidden aria-label="Nach oben">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <div class="sheet-titles">
      <h2 id="sheet-title">Termine</h2>
      <p class="sheet-sub" id="sheet-sub"></p>
    </div>
    <button class="text-btn" id="sheet-close">Fertig</button>
  </div>
  <div class="sheet-find" id="sheet-find" hidden>
    <input id="find-input" type="search" autocomplete="off" autocorrect="off"
           autocapitalize="none" spellcheck="false" placeholder="Suchen">
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
