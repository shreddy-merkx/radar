name: Radar bauen und veröffentlichen

on:
  # Alle 30 Minuten. Bewusst nicht zur vollen Stunde: Dann starten weltweit
  # zigtausend Abläufe gleichzeitig und GitHub schiebt die Warteschlange vor
  # sich her. Sieben nach und siebenunddreißig nach ist es ruhiger.
  schedule:
    - cron: '7,37 * * * *'

  # Jede Änderung am Code veröffentlicht sofort neu.
  push:
    branches: [main]

  # Von Hand auslösbar. Zwei Gründe: zum Ausprobieren -- und weil GitHub
  # zeitgesteuerte Abläufe abschaltet, wenn 60 Tage lang nichts im Projekt
  # passiert ist. Einmal hier auf "Run workflow" zu drücken, weckt sie wieder.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Bau noch, während der nächste startet, gewinnt der neuere.
# Kein Abbruch mitten im Veröffentlichen -- deshalb cancel-in-progress: false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bausteine installieren
        run: npm install --no-audit --no-fund

      - name: Feeds abrufen und digest.json schreiben
        run: node build/fetch.mjs

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./app

      - name: Veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4
